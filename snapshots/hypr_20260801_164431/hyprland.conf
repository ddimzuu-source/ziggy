
# --- HYPRLAND BASIC CONFIG ---
# Autostart
exec-once = waybar
exec-once = hyprpaper &
exec-once = hypridle &

# Modifier Key (SUPER = Tombol Windows)
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin

# Monitor & Scaling
monitor=,preferred,auto,1.25

# Input / Keyboard
input {
    kb_layout = us
    follow_mouse = 1
}

# General Layout
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(ffffffaa) rgba(888888aa) 45deg
        col.inactive_border = rgba(222222aa)
    layout = dwindle
}

decoration {
    # Bikin sudut jendela jadi melengkung (rounded corners)
    rounding = 10

    # Efek transisi halus (opsional, bikin makin smooth)
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}
# Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

# Layout tweaks
dwindle {
    preserve_split = true    
}

# General behavior
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    
}

# Gestures (touchpad)
gestures {
    
}

# Window Rules
#windowrule = float on, match:class pavucontrol
#windowrule = float on, match:class blueman-manager
#windowrule = float on, match:class nm-connection-editor
#windowrule = size 800 600, match:class blueman-manager
#windowrule = float on, match:title nmtui

# Basic Keybindings
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, wofi --show drun

# Window Focus (Panah)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# --- TOMBOL FN (VOLUME & BRIGHTNESS) ---

# Volume Control (perlu wireplumber / wpctl)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness Control (perlu brightnessctl)
binde = , XF86MonBrightnessUp, exec, brightnessctl set +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Screenshot Clean (Langsung simpan ke folder Screenshots)
bind = SUPER SHIFT, S, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = SUPER ALT, S, exec, hyprshot -m output -o ~/Pictures/Screenshots

# Lockscreen & Sleep
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, X, exec, systemctl suspend
bind = $mainMod, Escape, exec, ~/.config/hypr/scripts/powermenu.sh

# Reload Waybar
bind = $mainMod SHIFT, W, exec, killall waybar; nohup waybar > /dev/null 2>&1 & disown

# Resize mode
bind = $mainMod, S, submap, resize
submap = resize
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset
submap = reset

