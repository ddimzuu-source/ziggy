background {
    monitor =
    path = /home/drmwnmass/Pictures/win11_dark.jpg
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 0.85
    brightness = 0.85
    vibrancy = 0.15
}

general {
    hide_cursor = true
   
}

# Kolom password - transparan/glass look
input-field {
    monitor =
    size = 320, 58
    outline_thickness = 1
    dots_size = 0.3
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##ffffff" font_weight="light">  Enter Password</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    rounding = 29
    shadow_passes = 2
    shadow_size = 3
}

# Jam besar
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.98)
    font_size = 110
    font_family = DejaVu Sans Light
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
}

# Tanggal
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = Cantarell
    position = 0, 30
    halign = center
    valign = center
}

# Greeting username
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(255, 255, 255, 0.5)
    font_size = 15
    font_family = Cantarell
    position = 0, -170
    halign = center
    valign = center
}

# Battery indicator kecil di bawah
label {
    monitor =
    text = cmd[update:10000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '--')% Battery"
    color = rgba(255, 255, 255, 0.4)
    font_size = 13
    font_family = Cantarell
    position = 0, 40
    halign = center
    valign = bottom
}
